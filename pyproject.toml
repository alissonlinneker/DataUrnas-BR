[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataurnas-br"
version = "0.1.0"
description = "Auditoria independente dos dados eleitorais brasileiros"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "asn1tools>=0.166.0,<1",
    "httpx>=0.27.0,<1",
    "py7zr>=0.22.0,<2",
    "click>=8.1.0,<9",
    "duckdb>=1.1.0,<2",
    "pandas>=2.0.0,<3",
    "numpy>=1.26.0,<3",
    "pyarrow>=15.0.0,<25",
]

[project.optional-dependencies]
# width="stretch" em st.plotly_chart exige Streamlit 1.51 ou superior.
dashboard = [
    "streamlit>=1.51.0,<2",
    "plotly>=5.22.0,<7",
    "scipy>=1.12.0,<2",
    "openpyxl>=3.1.0,<4",
]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
dataurnas = "dataurnas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "scripts/features", "data"]

[tool.ruff.lint]
# Conjunto base: erros reais (pyflakes, sintaxe) e bugs prováveis (bugbear).
# Estilo (E501, UP) fica para o `ruff format` gradual.
select = ["E4", "E7", "E9", "F", "W6", "B"]
ignore = [
    "B008",  # chamadas em argumentos padrão (padrão do click)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # imports após sys.path.insert
"tests/*" = ["B011"]
"scripts/ele2026/*.py" = ["B023"]  # workers aguardados na mesma iteração
