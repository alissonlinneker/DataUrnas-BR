<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1188" viewBox="0 0 1000 1188" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Veredicto da auditoria: eleição presidencial de 2026</title>
<desc id="descricao">Infográfico do veredicto: nenhuma evidência de manipulação, de contagem errada ou de dado impossível nos arquivos públicos, em nenhum dos dois turnos. Verificado: Coleta versionada, 8 voltas de reconferência: 0 arquivos alterados ou removidos; Assinatura digital de todos os arquivos: 5.487.289 válidas, 0 inválidas; Soma dos BUs x resultado oficial: igual voto a voto: Brasil, UFs e 5.757 municípios; Totais divulgados durante a apuração: 12 mil versões; nunca diminuíram; Valores impossíveis no BU: 0 em 998.414 BUs dos dois turnos; Recontagem do RDV x BU: 0 divergências: 499.206 seções (1º) e 499.205 (2º); Log eleitor a eleitor x BU: votos no log = comparecimento em 2.997 seções; Encerramento tardio e margem: pior cenário ainda mantém 4.398.399 de margem; BUs emitidos mais de 1 h após o encerramento: 368 seções; 0 votos depois do fim; Viradas por seção do 1º para o 2º turno: 31.341 observadas x 32.604 esperadas; Estatística forense com 2022 como controle: nenhum padrão maior que o de 2022; Modelo de urna, troca e contingência: maior pior caso: 3.957 votos; Biometria do 1º x 2º turno: variações de décimos de ponto, sem relação com o voto; Cargas x logs de preparação (GEDAI): 99,83% conferem; 862 cargas sem log; Linha do tempo de emissão e totalização: nenhum BU emitido depois de totalizado; Dados abertos x BU: 0 divergências de voto; Hashes lacrados x programas nos logs: todos os de inicialização estão na lista; Assinatura JWS dos resultados divulgados: 11.572 válidas, 0 inválidas; Alegações externas sobre viradas: explicadas pela ordem geográfica de chegada; Pacote oficial do 2º turno x noite da eleição: 998.356 arquivos idênticos ao guardado; Imagem do BU e log x BU, pacote completo: votos iguais nas 499.207 seções por turno; Ordem e horário de chegada dos BUs: nenhum sinal de injeção; segue a geografia; Plausibilidade da virada: chance perto de 50% pela margem do 1º turno. Não pode ser verificado com dados públicos: Qual software rodou em cada urna (a ligação com a lista lacrada só é feita por amostragem, com relatórios não publicados); Adulteração idêntica em todas as urnas (não deixa diferença entre grupos; depende do Teste de Integridade (relatório até 23/01/2027)); O que aconteceu na seção fora do arquivo (por exemplo, a demora de uma mesa para emitir o BU: está nas atas, não nos arquivos). 13 pontos pedem esclarecimento do TSE, nenhum altera a contagem.</desc>
