<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Arquitetura do DataUrnas-BR</title>
<desc id="descricao">Diagrama de fluxo em cinco etapas: a API pública do TSE alimenta o downloader e a coleta de 2026; os arquivos são decodificados (BU e RDV em ASN.1, log 7z e assinatura com hashes SHA-512); as verificações de integridade, consistência, log e estatística geram ocorrências; os resultados ficam em DuckDB e Parquet ZSTD e são exibidos no painel Streamlit.</desc>
