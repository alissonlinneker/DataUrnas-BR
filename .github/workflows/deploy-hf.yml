name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez; um push novo espera o anterior em vez de disputar o push forçado
concurrency:
  group: deploy-hf
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  sync-to-hf:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          SPACE_NAME: ${{ vars.SPACE_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ] || [ -z "${HF_USERNAME}" ] || [ -z "${SPACE_NAME}" ]; then
            echo "::error::Configure o secret HF_TOKEN e as variables HF_USERNAME e SPACE_NAME"
            exit 1
          fi

          # Repositório limpo para o HF (evita histórico com blobs grandes)
          DEPLOY_DIR="${RUNNER_TEMP}/hf-deploy"
          rm -rf "${DEPLOY_DIR}"
          mkdir -p "${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"
          git init -b main
          git lfs install --local

          # Copiar arquivos do projeto (inclui dotfiles como .streamlit e .dockerignore)
          shopt -s dotglob
          for item in "${GITHUB_WORKSPACE}"/*; do
            case "$(basename "${item}")" in
              .git|.github) continue ;;
            esac
            cp -r "${item}" .
          done
          shopt -u dotglob
          # Depois da cópia, pois o .gitattributes do projeto sobrescreve o gerado aqui
          git lfs track "data/parquet/*.parquet" "data/parquet/**/*.parquet" "*.png" "*.jpg" "*.ico"

          # Frontmatter do HF Space no README
          {
            printf '%s\n' '---' 'title: DataUrnas-BR' 'emoji: 🗳️' 'colorFrom: green' \
              'colorTo: blue' 'sdk: docker' 'app_port: 7860' 'pinned: false' 'license: mit' '---' ''
            cat README.md
          } > "${RUNNER_TEMP}/hf_readme.md"
          mv "${RUNNER_TEMP}/hf_readme.md" README.md

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy from GitHub ${GITHUB_SHA::7}"

          # Token no header HTTP, não na URL (não aparece em argv nem em mensagens de erro do git)
          AUTH="$(printf '%s:%s' "${HF_USERNAME}" "${HF_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          git -c "http.https://huggingface.co/.extraheader=Authorization: Basic ${AUTH}" \
            push --force "https://huggingface.co/spaces/${HF_USERNAME}/${SPACE_NAME}" main
